<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>52-Week Protocol · Apex</title>
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080C10">
<style>
:root{
  --bg:#080C10; --panel:#0d1318; --panel2:#11181f;
  --border:#1a2d3a; --border2:#243845;
  --text:#E0E0E0; --muted:#7a8d99; --white:#fff;
  --accent:#00D4FF; --accent2:#00ff9d; --green:#00C48C;
  --orange:#FF6B35; --warn:#fbbf24; --bad:#ef4444;
  --foundation:#10b981; --layer:#00D4FF; --pulse:#FF6B35;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;
  font-size:15px;line-height:1.5;padding:24px 16px 80px;min-height:100vh;
}
.wrap{max-width:920px;margin:0 auto;}
.brand{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;text-align:center;margin-bottom:8px;color:var(--accent2);}
.brand span{color:var(--text);font-weight:500;}
h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.5px;text-align:center;margin:18px 0 8px;color:var(--white);}
h1 em{color:var(--accent2);font-style:normal;}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:28px;}
.goal-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;}
.goal-chip{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:999px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.goal-chip:hover{border-color:var(--accent);color:var(--text);}
.goal-chip.active{background:var(--accent2);border-color:var(--accent2);color:var(--bg);font-weight:700;}
.empty{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:36px 22px;text-align:center;}
.empty-icon{font-size:42px;margin-bottom:12px;}
.empty-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;color:var(--white);margin-bottom:6px;}
.empty-sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
.empty a{display:inline-block;padding:12px 22px;background:linear-gradient(135deg,var(--accent2),var(--green));color:var(--bg);text-decoration:none;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;}

.phases{display:grid;gap:18px;margin-bottom:24px;}
.phase{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 16px;border-left:4px solid var(--accent);}
.phase.p-clear{border-left-color:#a78bfa;}
.phase.p-reset{border-left-color:#00D4FF;}
.phase.p-rebuild{border-left-color:#00C48C;}
.phase.p-repair{border-left-color:#10b981;}
.phase.p-maintain{border-left-color:#7a8d99;}
.phase.p-titrate{border-left-color:#fbbf24;}
.phase.p-active{border-left-color:#00C48C;}
.phase.p-taper{border-left-color:#FF6B35;}
.phase.p-recomp{border-left-color:#a78bfa;}
.phase.p-ramp{border-left-color:#fbbf24;}
.phase.p-cycle{border-left-color:#00C48C;}
.phase.p-off{border-left-color:#7a8d99;}
.phase.p-pulse{border-left-color:#FF6B35;}
.phase.p-daily{border-left-color:#10b981;}
.phase.p-asneeded{border-left-color:#a78bfa;}
.phase.p-continuous{border-left-color:#00D4FF;}
.phase-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.phase-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.2px;color:var(--white);}
.phase-weeks{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
.phase-desc{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.5;}
.pep-rows{display:grid;gap:8px;}
.pep-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;}
.tier-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.tier-dot.foundation{background:var(--foundation);}
.tier-dot.layer{background:var(--layer);}
.tier-dot.pulse{background:var(--pulse);}
.pep-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;color:var(--white);flex:0 0 auto;}
.pep-cadence{color:var(--muted);font-size:12px;flex:1;}
.pep-window{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;flex-shrink:0;}

.synergy-card{background:rgba(0,255,157,.06);border-left:3px solid var(--accent2);padding:12px 14px;border-radius:8px;margin-top:14px;font-size:13px;}
.synergy-card strong{color:var(--accent2);}
.warning-card{background:rgba(255,107,53,.08);border-left:3px solid var(--orange);padding:12px 14px;border-radius:8px;margin-top:14px;font-size:13px;}
.warning-card strong{color:var(--orange);}

.legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:24px 0 12px;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;font-size:12px;}
.legend-item{display:flex;align-items:center;gap:6px;color:var(--muted);}

.timeline-section{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 16px;margin-bottom:24px;}
.timeline-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--white);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.tl-grid{display:grid;gap:6px;}
.tl-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;}
.tl-row-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:var(--white);display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-track{position:relative;height:20px;background:var(--panel2);border-radius:4px;overflow:hidden;}
.tl-bar{position:absolute;top:0;bottom:0;border-radius:3px;}
.tl-bar.foundation{background:var(--foundation);opacity:.85;}
.tl-bar.layer{background:var(--layer);opacity:.8;}
.tl-bar.pulse{background:var(--pulse);}
.tl-week-marks{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-top:6px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;}
.tl-week-marks-bar{display:flex;justify-content:space-between;}
.tl-phases{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-bottom:8px;align-items:center;}
.tl-phases-bar{position:relative;height:24px;background:var(--panel2);border-radius:4px;overflow:hidden;}
.tl-phase-band{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--white);font-weight:700;text-transform:uppercase;opacity:.85;}
.tl-phase-band.p-clear{background:#a78bfa;}
.tl-phase-band.p-reset{background:#00D4FF;}
.tl-phase-band.p-rebuild{background:#00C48C;}
.tl-phase-band.p-repair{background:#10b981;}
.tl-phase-band.p-maintain{background:#7a8d99;}
.tl-phase-band.p-titrate{background:#fbbf24;color:#000;}
.tl-phase-band.p-active{background:#00C48C;}
.tl-phase-band.p-taper{background:#FF6B35;}
.tl-phase-band.p-recomp{background:#a78bfa;}
.tl-phase-band.p-ramp{background:#fbbf24;color:#000;}
.tl-phase-band.p-cycle{background:#00C48C;}
.tl-phase-band.p-off{background:#7a8d99;}
.tl-phase-band.p-pulse{background:#FF6B35;}
.tl-phase-band.p-daily{background:#10b981;}
.tl-phase-band.p-asneeded{background:#a78bfa;}
.tl-phase-band.p-continuous{background:#00D4FF;}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:#fbbf24;box-shadow:0 0 8px #fbbf24;z-index:10;pointer-events:none;}
.tl-today::after{content:'TODAY';position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-size:8px;color:#fbbf24;letter-spacing:.1em;}
.tl-today-row::after{content:none;}

.actions{display:grid;gap:10px;margin-top:24px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 22px;border-radius:10px;text-decoration:none;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:0;}
.btn-primary{background:linear-gradient(135deg,var(--accent2),var(--green));color:var(--bg);box-shadow:0 4px 16px rgba(0,255,157,.25);}
.btn-secondary{background:transparent;border:1px solid var(--border2);color:var(--text);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}

.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px;padding:14px;}
.footer a{color:var(--accent);text-decoration:none;}

@media (max-width:680px){
  .tl-row{grid-template-columns:96px 1fr;}
  .tl-week-marks{grid-template-columns:96px 1fr;}
  h1{font-size:26px;}
}
</style>
</head>

  selection = raw.map(s => s.replace('.html','')).filter(s => PEPS[s]);
} catch(e){}

// If no real selection, fall back to demo stack for current goal so users see the view
if (selection.length === 0) {
  selection = DEMO_STACKS[activeGoal] || DEMO_STACKS.longevity;
  isDemo = true;
}

// ============================================================
// RENDER
// ============================================================
const goalBar = document.getElementById('goal-bar');
Object.keys(PHASE_TEMPLATES).forEach(k => {
  const chip = document.createElement('button');
  chip.className = 'goal-chip' + (k === activeGoal ? ' active' : '');
  chip.textContent = GOAL_LABELS[k];
  chip.dataset.goal = k;
  chip.addEventListener('click', () => {
    activeGoal = k;
    try { localStorage.setItem('apex_active_goal', k); } catch(e){}
    if (isDemo) {
      selection = DEMO_STACKS[k] || DEMO_STACKS.longevity;
    }
    document.querySelectorAll('.goal-chip').forEach(c => c.classList.toggle('active', c.dataset.goal === k));
    render();
  });
  goalBar.appendChild(chip);
});

function bucketPepsByPhase(peps, template) {
  const buckets = {};
  template.forEach(p => buckets[p.key] = []);
  peps.forEach(slug => {
    const info = PEPS[slug];
    if (!info) return;
    // Find which phase this peptide belongs to. Default to first phase for goal.
    let phaseKey = info.phase;
    // If peptide's phase doesn't exist in this goal's template, bucket by tier
    if (!buckets[phaseKey]) {
      if (info.tier === 'foundation') {
        // Find a "continuous" or "maintain" or last phase
        phaseKey = template.find(p => /maintain|continuous|active|daily|cycle/.test(p.key))?.key || template[template.length-1].key;
      } else {
        phaseKey = template[0].key;
      }
    }
    buckets[phaseKey].push({slug, ...info});
  });
  // Sort within bucket by sequenceOrder if present
  Object.keys(buckets).forEach(k => {
    buckets[k].sort((a,b) => (a.sequenceOrder||99) - (b.sequenceOrder||99));
  });
  return buckets;
}

function findSynergies(peps) {
  return SYNERGIES.filter(s => s.peps.every(p => peps.includes(p)));
}

function findPulseConflicts(peps) {
  const pulses = peps.filter(p => PEPS[p] && PEPS[p].tier === 'pulse');
  return pulses.length >= 2 ? pulses : [];
}

function render() {
  const content = document.getElementById('content');
  if (selection.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🧬</div>
        <div class="empty-title">No peptides in your stack yet</div>
        <div class="empty-sub">Build a stack first — then come back here to see your phased schedule.</div>
        <a href="compare.html">Build my stack →</a>
      </div>`;
    return;
  }

  const template = PHASE_TEMPLATES[activeGoal];
  const buckets = bucketPepsByPhase(selection, template);
  const synergies = findSynergies(selection);
  const pulseConflicts = findPulseConflicts(selection);

  let html = '';

  // Demo banner
  if (isDemo) {
    html += `<div style="background:rgba(0,212,255,.08);border-left:3px solid var(--accent);padding:12px 14px;border-radius:8px;margin-bottom:18px;font-size:13px;">
      <strong style="color:var(--accent);">📺 Demo view —</strong> showing a sample <strong>${GOAL_LABELS[activeGoal]}</strong> stack so you can see the schedule logic. Switch goal chips above to compare. <a href="compare.html" style="color:var(--accent2);text-decoration:none;font-weight:700;">Build your real stack →</a>
    </div>`;
  }

  // Pulse-conflict warning
  if (pulseConflicts.length >= 2) {
    const order = pulseConflicts
      .map(p => ({slug:p, order:PEPS[p].sequenceOrder||99, name:PEPS[p].name}))
      .sort((a,b) => a.order - b.order)
      .map(p => p.name);
    html += `<div class="warning-card">
      <strong>⏳ Multiple pulse peptides selected.</strong> ${pulseConflicts.map(p=>PEPS[p].name).join(' + ')} are all 1-2× per year protocols. Running them simultaneously wastes the window. Suggested year-order: <strong>${order.join(' → ')}</strong>.
    </div>`;
  }

  // Phases
  html += '<div class="phases">';
  template.forEach(phase => {
    const peps = buckets[phase.key] || [];
    if (peps.length === 0 && template.length > 2) return; // hide empty phases when goal has many
    html += `
      <div class="phase p-${phase.key}">
        <div class="phase-head">
          <div class="phase-name">${phase.name}</div>
          <div class="phase-weeks">Wk ${phase.weeks[0]}–${phase.weeks[1]}</div>
        </div>
        <div class="phase-desc">${phase.desc}</div>`;
    if (peps.length === 0) {
      html += `<div style="color:var(--muted);font-size:12px;font-style:italic;">No peptides scheduled in this phase from your selection.</div>`;
    } else {
      html += '<div class="pep-rows">';
      peps.forEach(p => {
        const tierLbl = p.tier.charAt(0).toUpperCase() + p.tier.slice(1);
        html += `
          <div class="pep-row">
            <div class="tier-dot ${p.tier}" title="${tierLbl}"></div>
            <div class="pep-name">${p.name}${p.rx?' <span style="color:var(--orange);font-size:10px;">⚠Rx</span>':''}</div>
            <div class="pep-cadence">${p.freq}${p.note?' · '+p.note:''}</div>
            <div class="pep-window">${p.cycleWeeks}wk ${p.offWeeks?'on / '+p.offWeeks+'wk off':''}</div>
          </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';

  // Synergy callouts
  if (synergies.length > 0) {
    synergies.forEach(s => {
      html += `<div class="synergy-card">⚡ ${s.msg}</div>`;
    });
  }

  // Visual 52-week timeline
  html += `
    <div class="timeline-section">
      <div class="timeline-title">📅 52-Week Visual Timeline</div>`;

  // Phase-band row at top of timeline
  html += '<div class="tl-phases"><div style="font-family:Share Tech Mono,monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;">PHASES</div><div class="tl-phases-bar">';
  template.forEach(phase => {
    const left = ((phase.weeks[0]-1)/52)*100;
    const right = 100 - (phase.weeks[1]/52)*100;
    html += `<div class="tl-phase-band p-${phase.key}" style="left:${left}%;right:${right}%;">${phase.name}</div>`;
  });
  // Today marker — calculate position based on weeks since cycle start
  // For demo, show today at week 0 (start of timeline)
  html += `<div class="tl-today" style="left:0%;"></div>`;
  html += '</div></div>';

  html += `<div class="tl-grid">`;
  selection.forEach(slug => {
    const p = PEPS[slug];
    if (!p) return;
    const cycleWk = p.cycleWeeks;
    const offWk = p.offWeeks;
    const total = cycleWk + offWk;
    let bars = '';
    if (p.tier === 'foundation') {
      bars = `<div class="tl-bar foundation" style="left:0%;right:0%;"></div>`;
    } else if (p.tier === 'pulse') {
      // Single pulse window based on sequenceOrder
      const order = p.sequenceOrder || 1;
      const startWk = (order - 1) * 8 + 1; // FOX04=wk1, Epitalon=wk9, Cartalax=wk17, etc.
      const endWk = startWk + cycleWk;
      const left = ((startWk-1)/52)*100;
      const right = 100 - (endWk/52)*100;
      bars = `<div class="tl-bar pulse" style="left:${left}%;right:${right}%;"></div>`;
    } else {
      // Layer — repeat ON/OFF cycles across 52 weeks
      let wk = 0;
      while (wk < 52 && total > 0) {
        const onStart = wk;
        const onEnd = Math.min(wk + cycleWk, 52);
        const left = (onStart/52)*100;
        const right = 100 - (onEnd/52)*100;
        bars += `<div class="tl-bar layer" style="left:${left}%;right:${right}%;"></div>`;
        wk += total;
      }
    }
    html += `
      <div class="tl-row">
        <div class="tl-row-name"><span class="tier-dot ${p.tier}"></span>${p.name}</div>
        <div class="tl-track">${bars}<div class="tl-today tl-today-row" style="left:0%;top:0;"></div></div>
      </div>`;
  });
  html += `</div>
      <div class="tl-week-marks">
        <div></div>
        <div class="tl-week-marks-bar" id="month-marks"></div>
      </div>
    </div>`;

  // Build month labels dynamically based on today
  setTimeout(() => {
    const monthMarks = document.getElementById('month-marks');
    if (monthMarks) {
      const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      const today = new Date();
      const startMonth = today.getMonth();
      let labels = '';
      for (let i = 0; i < 12; i += 2) {
        labels += `<span>${months[(startMonth + i) % 12]}</span>`;
      }
      monthMarks.innerHTML = labels;
    }
  }, 0);

  // Legend
  html += `
    <div class="legend">
      <div class="legend-item"><span class="tier-dot foundation"></span>Foundation · runs 52 weeks</div>
      <div class="legend-item"><span class="tier-dot layer"></span>Layer · cycles on/off</div>
      <div class="legend-item"><span class="tier-dot pulse"></span>Pulse · 1-2× per year</div>
    </div>`;

  // Actions
  html += `
    <div class="actions">
      <a href="reconstitute.html" class="btn btn-primary">⚡ Continue to reconstitution →</a>
      <a href="compare.html" class="btn btn-secondary">← Edit my stack</a>
    </div>`;

  content.innerHTML = html;
}

render();
</script>
</body>
</html>
